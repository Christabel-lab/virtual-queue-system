<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Queue System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .panel { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: #f9f9f9; padding: 20px; border-radius: 6px; border: 1px solid #ddd; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        button.serve-btn { background-color: #2ecc71; }
        button.serve-btn:hover { background-color: #27ae60; }
        ul { list-style: none; padding: 0; }
        li { background: #eef2f3; margin-bottom: 8px; padding: 10px 15px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏢 Live Virtual Queue Dashboard</h1>
    <p>A real-world implementation of a FIFO (First-In, First-Out) queue structure powering a web service.</p>

    <div class="panel">
        <!-- Customer Panel -->
        <div class="card">
            <h2>Customer Portal</h2>
            <form id="joinForm">
                <label>Your Name:</label>
                <input type="text" id="name" required placeholder="e.g. Alice">
                
                <label>Service Type:</label>
                <select id="service">
                    <option value="Consultation">Consultation</option>
                    <option value="Technical Support">Technical Support</option>
                    <option value="Billing">Billing</option>
                </select>
                
                <button type="submit">Get Ticket (Join Queue)</button>
            </form>
        </div>

        <!-- Staff Panel -->
        <div class="card">
            <h2>Staff Portal</h2>
            <p>Click below to call the next customer waiting at the front of the line.</p>
            <button class="serve-btn" onclick="serveNextCustomer()">Call Next Customer</button>
            <div id="currentServed" style="margin-top: 15px; font-weight: bold; color: #27ae60;"></div>
        </div>
    </div>

    <h2>Current Queue Line (<span id="queueCount">0</span> waiting)</h2>
    <ul id="queueList">
        <!-- Dynamic queue items will load here -->
    </ul>
</div>

<script>
    async function fetchQueue() {
        const response = await fetch('/api/queue');
        const data = await response.json();
        
        const queueList = document.getElementById('queueList');
        const queueCount = document.getElementById('queueCount');
        
        queueList.innerHTML = '';
        queueCount.innerText = data.total_waiting;

        if (data.queue.length === 0) {
            queueList.innerHTML = '<li><i>No customers currently waiting in line.</i></li>';
            return;
        }

        data.queue.forEach((ticket, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>#${ticket.id}</strong> - ${ticket.name} (${ticket.service})</span> <span>Position: ${index + 1}</span>`;
            queueList.appendChild(li);
        });
    }

    document.getElementById('joinForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const service = document.getElementById('service').value;

        const response = await fetch('/api/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, service })
        });

        const result = await response.json();
        if (result.success) {
            alert(`Success! Your Ticket ID is #${result.assigned_ticket.id}`);
            document.getElementById('name').value = '';
            fetchQueue();
        }
    });

    async function serveNextCustomer() {
        const response = await fetch('/api/next', { method: 'POST' });
        const result = await response.json();
        
        const servedDiv = document.getElementById('currentServed');
        if (result.success) {
            servedDiv.innerText = `Now Serving: #${result.served.id} - ${result.served.name}`;
            fetchQueue();
        } else {
            servedDiv.innerText = result.message;
        }
    }

    // Refresh queue automatically every 3 seconds
    setInterval(fetchQueue, 3000);
    fetchQueue();
</script>

</body>
</html>
